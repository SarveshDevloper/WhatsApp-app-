name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VER_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1;}')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR, which is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have the .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "APK successfully verified: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$ASSET_DIR"

          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to copy APK to $ASSET_PATH or file is empty."
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset does not end with .apk"; exit 1 ;;
          esac

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES=$(cat <<EOF
This is an automatically generated debug APK.
The APK was built by GitHub Actions.
GitHub Actions Run Number: ${{ github.run_number }}
GitHub Actions Run Attempt: ${{ github.run_attempt }}
Source Commit SHA: ${{ github.sha }}
The APK is intended for testing.
The APK is not a Play Store production release.
The APK is signed only with a temporary debug keystore.
EOF
          )

          echo "Creating release $TAG with title '$TITLE' targeting commit $TARGET_COMMIT..."
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          echo "Release publishing outcome: $PUBLISH_OUTCOME"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$TAG"
            RELEASE_URL=$(gh release view "$TAG" --json url --jq .url)
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK has been published directly to GitHub Releases for direct phone download:"
              echo "- **Release Page:** [$TITLE]($RELEASE_URL)"
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Downloadable APK Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 You can download the APK directly from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo "📦 The standard GitHub Actions artifact named \`app-debug-apk\` is also available as a backup under this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed ($PUBLISH_OUTCOME), but the APK build and Actions artifact upload succeeded."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact Name: app-debug-apk"

            {
              echo "## ⚠️ Debug APK Built Successfully (Release Publishing Notice)"
              echo ""
              echo "The debug APK build succeeded and is safely stored as a GitHub Actions artifact."
              echo ""
              echo "- **Artifact Name:** \`app-debug-apk\`"
              echo "- **Location:** You can download the APK from the **Artifacts** section at the bottom of this workflow run summary."
              echo ""
              echo "> **Note:** GitHub Release publication encountered an issue or lacked permissions, but your build was NOT lost and the APK artifact is ready for download."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
